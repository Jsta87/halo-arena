name: OpenCE Raspberry Pi AArch64 build

on:
  push:
    branches: [opence-rpi-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Enable AArch64 build environment
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build OpenCE for Raspberry Pi OS 64-bit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/out:/out" \
            -v "$GITHUB_WORKSPACE/tools/opence_rpi_patch.py:/opence_rpi_patch.py:ro" \
            arm64v8/debian:bookworm-slim /bin/bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates git curl python3 clang lld llvm ninja-build cmake pkg-config \
                build-essential file binutils zip \
                libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxtst-dev \
                libxfixes-dev libxrender-dev libxss-dev libwayland-dev \
                libxkbcommon-dev libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev \
                libgl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

              git clone --depth 1 https://github.com/libsdl-org/SDL.git --branch release-3.4.16 /tmp/SDL
              cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
                -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
              ninja -C /tmp/SDL/build
              cmake --install /tmp/SDL/build
              ldconfig

              git clone --depth 1 https://github.com/OpenCommunityEdition/OpenCE.git /src
              cd /src
              python3 /opence_rpi_patch.py
              python3 configure.py --release --pgo=off --lto=off --linux-cc=clang
              ninja -v linux

              mkdir -p /out/OpenCE-RaspberryPi-aarch64
              cp build/linux/halo build/linux/brokers.txt build/linux/map_validate /out/OpenCE-RaspberryPi-aarch64/
              cp port/linux/README.md README.md /out/OpenCE-RaspberryPi-aarch64/
              cp /usr/local/lib/libSDL3.so.0 /out/OpenCE-RaspberryPi-aarch64/
              printf "%s\n" \
                "OpenCE Raspberry Pi build" \
                "Target: Raspberry Pi OS 64-bit (AArch64), Cortex-A53" \
                "Renderer: OpenGL ES" \
                "Game data/maps are not redistributed; supply your own as OpenCE documents." \
                > /out/OpenCE-RaspberryPi-aarch64/RASPBERRY-PI.txt

              file build/linux/halo | tee /out/OpenCE-RaspberryPi-aarch64/BUILD-VALIDATION.txt
              readelf -h build/linux/halo | tee -a /out/OpenCE-RaspberryPi-aarch64/BUILD-VALIDATION.txt
              ldd build/linux/halo | tee -a /out/OpenCE-RaspberryPi-aarch64/BUILD-VALIDATION.txt
              readelf -h build/linux/halo | grep -q "Machine:.*AArch64"
              cd /out
              zip -qr OpenCE-RaspberryPi-aarch64.zip OpenCE-RaspberryPi-aarch64
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenCE-RaspberryPi-aarch64
          path: out/OpenCE-RaspberryPi-aarch64.zip
          if-no-files-found: error
          retention-days: 7
